<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria Forno e Código</title>
    <link rel="icon" type="image/x-icon" href="../images/pizza-icon.png">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>
    <header>
        <img src="../images/logo.png">
        <div>
            <h1>Forno e Código</h1>
            <h2>As melhores pizzas da região.</h2>
        </div>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="cardapio.html">Cardápio</a></li>
                <li><a id="cart" href="carrinho.html"><img src=../images/carrinho.png></a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <img src="../images/perfil.png">
        <section>
            <div class="container">
                <form>
                    <h3>Cadastre-se:</h3>

                    <label for="Nome">Nome</label>
                    <input id="Nome" type="text" placeholder="Nome Sobrenome">

                    <label for="cep">CEP</label>
                    <input id="cep" type="number" placeholder="00000-000">

                    <label for="numero">N°</label>
                    <input id="numero" type="number" placeholder="1234">

                    <label for="complemento">Complemento</label>
                    <input id="complemento" type="text" placeholder="Bloco A, Apto 01...">

                    <label>Telefone</label>
                    <input id="telefone" type="number" placeholder="(11) 99999-9999">

                    <label>E-mail</label>
                    <input id="email" type="email" placeholder="exemplo@email.com">

                    <label>CPF (opcional)</label>
                    <input id="cpf" type="number" placeholder="000.000.000-00">

                    <label>Crie uma senha</label>
                    <input id="senha" type="password" placeholder="********">
                    
                    <input value="Cadastrar" type="submit">
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pizzaria Forno e Código. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
